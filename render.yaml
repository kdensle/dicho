services:
  - type: web
    name: dicho-api
    env: docker
    rootDir: Backend
    plan: starter
    autoDeploy: false
    healthCheckPath: /health
    disk:
      name: dicho-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: DATA_DIR
        value: /data
      - key: FREE_MONTHLY_LIMIT
        value: 30
      - key: MAX_MESSAGE_CHARS
        value: 4000
      - key: MAX_REQUEST_BYTES
        value: 65536
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 25
      - key: APPLE_BUNDLE_ID
        value: com.kyledensley.dicho
      - key: SUBSCRIPTION_PRODUCT_ID
        value: dicho.pro.monthly
      - key: ALLOW_UNSIGNED_STOREKIT_JWS
        value: false
